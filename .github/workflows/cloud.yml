name: Floci Multi-Cloud Interactive Lab (5-Hour SSH + Web UI)

on:
  workflow_dispatch:
    inputs:
      cloud_env:
        description: 'Select Cloud Environment to Provision'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - aws
          - az
          - gcp
          - oci
      ssh_public_key:
        description: 'Your SSH Public Key (Optional)'
        required: false
        type: string
      session_hours:
        description: 'Interactive session duration in hours (Max 5)'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '3'
          - '5'

jobs:
  floci-interactive-host:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Floci CLI & Tunnel Tools
        run: |
          curl -fsSL https://floci.io/install.sh | sh
          echo "$HOME/.floci/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo apt-get update -y
          sudo apt-get install -y tmux tmate jq netcat-openbsd dnsutils

          # Install bore (TCP SSH tunnel)
          curl -Ls https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin

          # Install cloudflared (Instant HTTPS Web UI tunnel)
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Selected Floci Cloud Services & Unified Web UI (:4500)
        env:
          SELECTED_ENV: ${{ inputs.cloud_env }}
        run: |
          export PATH="$HOME/.floci/bin:$HOME/.local/bin:$PATH"
          mkdir -p $HOME/floci-data/{aws,az,gcp,oci}

          start_aws() {
            docker run -d --name floci-aws --restart unless-stopped \
              -p 4566:4566 \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v $HOME/floci-data/aws:/app/data \
              floci/floci:latest-compat
          }

          start_az() {
            docker run -d --name floci-az --restart unless-stopped \
              -p 4577:4577 \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v $HOME/floci-data/az:/app/data \
              -e FLOCI_AZ_TLS_ENABLED="true" \
              -e FLOCI_AZ_HOSTNAME="localhost" \
              floci/floci-az:latest-compat
          }

          start_gcp() {
            docker run -d --name floci-gcp --restart unless-stopped \
              -p 4588:4588 \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v $HOME/floci-data/gcp:/app/data \
              floci/floci-gcp:latest
          }

          start_oci() {
            docker run -d --name floci-oci --restart unless-stopped \
              -p 4599:4599 \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v $HOME/floci-data/oci:/app/data \
              floci/floci-oci:latest-compat
          }

          case "$SELECTED_ENV" in
            aws) start_aws ;;
            az)  start_az ;;
            gcp) start_gcp ;;
            oci) start_oci ;;
            all)
              start_aws
              start_az
              start_gcp
              start_oci
              ;;
          esac

          docker run -d --name floci-ui --restart unless-stopped \
            --network host \
            -e PORT=4500 \
            -e FLOCI_ENDPOINT=http://localhost:4566 \
            -e FLOCI_AZURE_ENDPOINT=http://localhost:4577 \
            -e FLOCI_AZURE_ACCOUNT_NAME=devstoreaccount1 \
            -e FLOCI_GCP_ENDPOINT=http://localhost:4588 \
            -e FLOCI_GCP_PROJECT=floci-local \
            -e FLOCI_OCI_ENDPOINT=http://localhost:4599 \
            -e AWS_REGION=us-east-1 \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            floci/floci-ui:latest

      - name: Start SSH & Web Console Tunnels (Prints URLs Immediately)
        env:
          USER_SSH_KEY: ${{ inputs.ssh_public_key }}
          SECRET_SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set +e
          sudo mkdir -p /var/run/sshd
          mkdir -p $HOME/.ssh && chmod 700 $HOME/.ssh
          if [ -n "$USER_SSH_KEY" ]; then
            echo "$USER_SSH_KEY" >> $HOME/.ssh/authorized_keys
          fi
          if [ -n "$SECRET_SSH_KEY" ]; then
            echo "$SECRET_SSH_KEY" >> $HOME/.ssh/authorized_keys
          fi

          TEMP_PASS=$(openssl rand -hex 8)
          echo "runner:$TEMP_PASS" | sudo chpasswd
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

          # 1. Start Bore tunnels (SSH :22 and Web UI :4500)
          nohup bore local 22 --to bore.pub > /tmp/bore-ssh.log 2>&1 </dev/null &
          nohup bore local 4500 --to bore.pub > /tmp/bore-ui.log 2>&1 </dev/null &

          # 2. Start Cloudflare HTTPS tunnel for Web UI (:4500)
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:4500 > /tmp/cf-ui.log 2>&1 </dev/null &

          # 3. Start tmate SSH fallback
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready

          # Wait up to 12 seconds for URLs to populate
          for i in {1..12}; do
            CF_URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/cf-ui.log | head -n 1)
            BORE_SSH_PORT=$(grep -oE 'bore\.pub:[0-9]+' /tmp/bore-ssh.log | head -n 1 | cut -d: -f2)
            [ -n "$CF_URL" ] && [ -n "$BORE_SSH_PORT" ] && break
            sleep 1
          done

          BORE_UI_PORT=$(grep -oE 'bore\.pub:[0-9]+' /tmp/bore-ui.log | head -n 1 | cut -d: -f2)
          BORE_IP=$(dig +short bore.pub | head -n 1)
          RUNNER_IP=$(curl -s https://ifconfig.me)
          TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          TMATE_WEB=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')

          echo ""
          echo "=================================================================="
          echo "🚀 FLOCI MULTI-CLOUD LAB + WEB UI READY (${{ inputs.cloud_env }})"
          echo "=================================================================="
          echo "🌐 1. DIRECT HTTPS WEB CONSOLE URL (Click to Open in Browser):"
          echo "   👉 $CF_URL"
          echo "   (Backup HTTP URL: http://bore.pub:$BORE_UI_PORT)"
          echo ""
          echo "🔑 2. SSH CREDENTIALS:"
          echo "   Runner Public IP      : $RUNNER_IP"
          echo "   Tunnel IP (bore.pub)  : $BORE_IP"
          echo "   SSH Username          : runner"
          echo "   Fallback SSH Password : $TEMP_PASS"
          echo ""
          echo "💻 3. SSH WITH LOCALHOST PORT FORWARDING (Run on your PC):"
          echo "   ssh -p $BORE_SSH_PORT -L 4500:localhost:4500 -L 4566:localhost:4566 -L 4577:localhost:4577 -L 4588:localhost:4588 -L 4599:localhost:4599 runner@bore.pub"
          echo ""
          echo "🛠️ 4. TMATE INSTANT SSH & WEB TERMINAL:"
          echo "   SSH : $TMATE_SSH"
          echo "   Web : $TMATE_WEB"
          echo "=================================================================="

          # Write a clickable Markdown summary to the GitHub Actions Summary page
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Floci Multi-Cloud Lab Ready (\`${{ inputs.cloud_env }}\`)
          | Access Method | Link / Command |
          | :--- | :--- |
          | **🌐 Direct Web Console (HTTPS)** | [**$CF_URL**]($CF_URL) |
          | **🌐 Backup Web Console (HTTP)** | \`http://bore.pub:$BORE_UI_PORT\` |
          | **💻 Web Terminal (Browser SSH)** | [**$TMATE_WEB**]($TMATE_WEB) |
          | **🔑 SSH Password** | \`$TEMP_PASS\` (User: \`runner\`) |
          | **⚡ Instant Tmate SSH** | \`$TMATE_SSH\` |
          | **🔌 Localhost Port-Forward SSH** | \`ssh -p $BORE_SSH_PORT -L 4500:localhost:4500 -L 4566:localhost:4566 -L 4577:localhost:4577 -L 4588:localhost:4588 -L 4599:localhost:4599 runner@bore.pub\` |
          EOF

      - name: Keep Session Alive for 5 Hours
        env:
          SESSION_HOURS: ${{ inputs.session_hours }}
        run: |
          echo "Session is now live! Click 'Summary' in the top-left sidebar or scroll up to 'Start SSH & Web Console Tunnels' for your clickable URLs."
          echo "To stop early, run inside SSH: touch /tmp/stop-session"
          MAX_SECONDS=$(( SESSION_HOURS * 3600 ))
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_SECONDS ]; do
            if [ -f /tmp/stop-session ]; then
              echo "Stop signal detected. Ending session..."
              break
            fi
            sleep 30
            ELAPSED=$(( ELAPSED + 30 ))
          done
